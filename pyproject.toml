[project]
name = "uncrashed-mcp"
version = "0.1.0"
description = "MCP server for editing the Uncrashed FPV Simulator track editor live"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "pillow>=10"]

[project.scripts]
uncrashed-mcp = "uncrashed_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uncrashed_mcp = ["data/*.json", "data/*.html"]
