[project]
name = "uncrashed-mcp"
version = "0.2.0"
description = "CLI and optional MCP server for editing the Uncrashed FPV Simulator track editor live"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
uncrashed = "uncrashed_mcp.cli:main"
uncrashed-mcp = "uncrashed_mcp.__main__:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uncrashed_mcp = ["data/*.json", "data/*.html"]
